<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="StudyFlow — простой планировщик учебных задач">
    <title>StudyFlow — учебный планировщик</title>
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <a class="brand" href="#" aria-label="StudyFlow, на главную">
          <span class="brand__mark" aria-hidden="true">S</span>
          <span>StudyFlow</span>
        </a>
        <button class="button button--primary" id="add-task-button" type="button">
          <span aria-hidden="true">＋</span> Новая задача
        </button>
      </header>

      <main>
        <section class="hero" aria-labelledby="page-title">
          <p class="eyebrow">Учебный планировщик</p>
          <h1 id="page-title">Все задания — в одном понятном списке</h1>
          <p>Записывайте дела, следите за сроками и отмечайте прогресс.</p>
        </section>

        <section class="stats" aria-label="Статистика задач">
          <article class="stat-card">
            <span class="stat-card__value" id="total-count">0</span>
            <span class="stat-card__label">Всего задач</span>
          </article>
          <article class="stat-card stat-card--accent">
            <span class="stat-card__value" id="active-count">0</span>
            <span class="stat-card__label">В работе</span>
          </article>
          <article class="stat-card">
            <span class="stat-card__value" id="done-count">0</span>
            <span class="stat-card__label">Выполнено</span>
          </article>
          <article class="stat-card stat-card--warning">
            <span class="stat-card__value" id="overdue-count">0</span>
            <span class="stat-card__label">Просрочено</span>
          </article>
        </section>

        <section class="workspace" aria-labelledby="tasks-title">
          <div class="workspace__heading">
            <div>
              <p class="eyebrow">Мои дела</p>
              <h2 id="tasks-title">Учебные задачи</h2>
            </div>
            <div class="data-actions">
              <button class="button button--quiet" id="demo-button" type="button">Пример</button>
              <button class="button button--quiet" id="export-button" type="button">Экспорт</button>
              <label class="button button--quiet" for="import-input">Импорт</label>
              <input class="visually-hidden" id="import-input" type="file" accept="application/json,.json">
            </div>
          </div>

          <div class="filters">
            <label class="search">
              <span class="visually-hidden">Поиск задач</span>
              <span aria-hidden="true">⌕</span>
              <input id="search-input" type="search" placeholder="Название или предмет">
            </label>
            <label>
              <span class="visually-hidden">Состояние</span>
              <select id="status-filter">
                <option value="all">Все состояния</option>
                <option value="active">В работе</option>
                <option value="done">Выполнено</option>
                <option value="overdue">Просрочено</option>
              </select>
            </label>
            <label>
              <span class="visually-hidden">Приоритет</span>
              <select id="priority-filter">
                <option value="all">Любой приоритет</option>
                <option value="high">Высокий</option>
                <option value="medium">Средний</option>
                <option value="low">Низкий</option>
              </select>
            </label>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
