<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="StudyFlow — простой планировщик учебных задач">
    <title>StudyFlow — учебный планировщик</title>
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <a class="brand" href="#" aria-label="StudyFlow, на главную">
          <span class="brand__mark" aria-hidden="true">S</span>
          <span>StudyFlow</span>
        </a>
        <button class="button button--primary" id="add-task-button" type="button">
          <span aria-hidden="true">＋</span> Новая задача
        </button>
      </header>

      <main>
        <section class="hero" aria-labelledby="page-title">
          <p class="eyebrow">Учебный планировщик</p>
          <h1 id="page-title">Все задания — в одном понятном списке</h1>
          <p>Записывайте дела, следите за сроками и отмечайте прогресс.</p>
        </section>

        <section class="stats" aria-label="Статистика задач">
          <article class="stat-card">
            <span class="stat-card__value" id="total-count">0</span>
            <span class="stat-card__label">Всего задач</span>
          </article>
          <article class="stat-card stat-card--accent">
            <span class="stat-card__value" id="active-count">0</span>
            <span class="stat-card__label">В работе</span>
          </article>
          <article class="stat-card">
            <span class="stat-card__value" id="done-count">0</span>
            <span class="stat-card__label">Выполнено</span>
          </article>
          <article class="stat-card stat-card--warning">
            <span class="stat-card__value" id="overdue-count">0</span>
            <span class="stat-card__label">Просрочено</span>
          </article>
        </section>
      </main>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
